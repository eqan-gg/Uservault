version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault123
      POSTGRES_DB: uservault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d uservault"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vault:vault123@db:5432/uservault
      SECRET_KEY: super-secret-jwt-key-change-in-prod
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
